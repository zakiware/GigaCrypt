<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>GigaCrypt HUD</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }
    .hud-card {
      -webkit-app-region: drag;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: calc(100vw - 12px);
      height: 48px;
      padding: 0 14px;
      background: rgba(14, 14, 18, 0.94);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(249, 115, 22, 0.45);
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(249, 115, 22, 0.25);
    }
    .folder-info {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      flex: 1;
    }
    .icon-badge {
      width: 26px;
      height: 26px;
      border-radius: 9px;
      background: rgba(249, 115, 22, 0.2);
      border: 1px solid rgba(249, 115, 22, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f97316;
      flex-shrink: 0;
    }
    .folder-text {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .folder-name {
      font-size: 12px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 140px;
    }
    .folder-status {
      font-size: 10px;
      color: #10b981;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .dot {
      width: 5px;
      height: 5px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 6px #10b981;
    }
    .actions {
      -webkit-app-region: no-drag;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .timer-pill {
      font-size: 11px;
      font-family: monospace;
      color: #9ca3af;
      background: rgba(255, 255, 255, 0.08);
      padding: 3px 7px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .lock-btn {
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      color: #ffffff;
      border: none;
      outline: none;
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 2px 10px rgba(234, 88, 12, 0.35);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .lock-btn:hover {
      filter: brightness(1.1);
      transform: scale(1.03);
    }
    .lock-btn:active {
      transform: scale(0.97);
    }
    .close-btn {
      background: none;
      border: none;
      color: #6b7280;
      font-size: 15px;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 6px;
      transition: all 0.15s;
      line-height: 1;
    }
    .close-btn:hover {
      color: #ef4444;
      background: rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body>
  <div class="hud-card">
    <div class="folder-info">
      <div class="icon-badge">
        <svg id="badgeIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
        </svg>
      </div>
      <div class="folder-text">
        <span class="folder-name" id="folderName">Объект</span>
        <span class="folder-status" id="folderStatus"><span class="dot" id="statusDot"></span>Открыт для работы</span>
      </div>
    </div>

    <div class="actions">
      <span class="timer-pill" id="timerBadge" title="Автоматическая блокировка / удаление копии">10:00</span>
      <button class="lock-btn" id="actionBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <span id="btnText">Заблокировать</span>
      </button>
      <button class="close-btn" id="closeBtn" title="Скрыть панель">✕</button>
    </div>
  </div>

  <script>
    let currentFolder = '';
    let currentTempDir = '';
    let isTempView = false;
    let secondsLeft = 600;
    let timerInterval = null;

    if (window.electronAPI.onActiveSessionsChanged) {
      window.electronAPI.onActiveSessionsChanged((sessions) => {
        if (sessions && sessions.length > 0) {
          isTempView = false;
          currentFolder = sessions[sessions.length - 1];
          const name = currentFolder.split(/[/\\]/).filter(Boolean).pop() || currentFolder;
          document.getElementById('folderName').textContent = name;
          document.getElementById('folderName').title = currentFolder;
          document.getElementById('folderStatus').innerHTML = '<span class="dot" style="background:#10b981"></span>Открыта для работы';
          document.getElementById('btnText').textContent = 'Заблокировать';
        }
      });
    }

    if (window.electronAPI.onActiveTempViewsChanged) {
      window.electronAPI.onActiveTempViewsChanged((views) => {
        if (views && views.length > 0 && !currentFolder) {
          isTempView = true;
          const v = views[views.length - 1];
          currentTempDir = v.tempDir;
          document.getElementById('folderName').textContent = v.name;
          document.getElementById('folderName').title = v.originalPath;
          document.getElementById('folderStatus').innerHTML = '<span class="dot" style="background:#f59e0b"></span>Временный просмотр';
          document.getElementById('btnText').textContent = 'Закрыть просмотр';
        }
      });
    }

    function updateTimer() {
      if (secondsLeft <= 0) {
        clearInterval(timerInterval);
        document.getElementById('timerBadge').textContent = '00:00';
        return;
      }
      secondsLeft--;
      const m = Math.floor(secondsLeft / 60);
      const s = secondsLeft % 60;
      document.getElementById('timerBadge').textContent = 
        `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    timerInterval = setInterval(updateTimer, 1000);

    document.getElementById('actionBtn').addEventListener('click', async () => {
      const btn = document.getElementById('actionBtn');
      btn.style.opacity = '0.6';
      if (isTempView && currentTempDir) {
        btn.innerHTML = '<span>Удаление копии...</span>';
        await window.electronAPI.closeTempView(currentTempDir);
      } else if (currentFolder) {
        btn.innerHTML = '<span>Блокировка...</span>';
        await window.electronAPI.relockFolder(currentFolder);
      }
    });

    document.getElementById('closeBtn').addEventListener('click', () => {
      window.electronAPI.closeWindow();
    });
  </script>
</body>
</html>
